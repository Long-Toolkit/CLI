version: 2

project_name: long-toolkit

before:
  hooks:
    - go mod tidy

builds:
  - id: long-toolkit
    main: .
    binary: long-toolkit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: long-toolkit
    ids:
      - long-toolkit
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: Long-Toolkit
    name: CLI

brews:
  - name: long-toolkit
    repository:
      owner: Long-Toolkit
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Long-Toolkit/long-toolkit"
    description: "Interactive no-code terminal CLI for Long-Toolkit, a hub of toolkits for longitudinal data in Python."
    license: "MIT"
    install: |
      bin.install "long-toolkit"
    test: |
      output = shell_output("#{bin}/long-toolkit --help", 1)
      assert_match "long-toolkit", output

scoops:
  - name: long-toolkit
    repository:
      owner: Long-Toolkit
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Long-Toolkit/long-toolkit"
    description: "Interactive no-code terminal CLI for Long-Toolkit, a hub of toolkits for longitudinal data in Python."
    license: "MIT"
